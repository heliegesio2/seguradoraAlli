services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"  # so para inspecao local (ex.: MongoDB Compass) - nao exponha assim em producao
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:-autoseguro}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-changeme}"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  quote-api:
    build: ./quote-service
    ports:
      - "8000:8000"
    environment:
      # instabilidade simulada (de proposito) -- ajuste se quiser durante o dev
      QUOTE_FAILURE_RATE: "0.20"
      QUOTE_SLOW_RATE: "0.10"
      QUOTE_SLOW_SECONDS: "8"
      # QUOTE_SEED: "42"   # descomente p/ falhas reproduziveis
    restart: unless-stopped

  agent-service:
    build: ./agent-service
    ports:
      - "8001:8001"
    volumes:
      # usuarios.json/knowledge_base.json/runtime_config.json dizem no proprio
      # codigo que "sobrevivem a reinicio do container" - sem isso, isso so era
      # verdade num restart simples; um rebuild (docker compose up --build)
      # recriava o container do zero e apagava usuarios cadastrados, base de
      # conhecimento aprovada e configuracoes do Admin (handoff_mode etc) sem
      # aviso nenhum. O volume fecha essa lacuna.
      - agent-data:/srv/data
    environment:
      QUOTE_SERVICE_URL: "http://quote-api:8000"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      CLAUDE_MODEL: "${CLAUDE_MODEL:-claude-opus-5}"
      CLAUDE_EFFORT: "${CLAUDE_EFFORT:-low}"
      # "site" (padrao): handoff humano continua no chat do site, sem custo de
      # WhatsApp Business API. "whatsapp": encaminha para o numero real abaixo.
      HANDOFF_MODE: "${HANDOFF_MODE:-site}"
      WHATSAPP_BUSINESS_NUMBER: "${WHATSAPP_BUSINESS_NUMBER:-}"
      # Copia cifrada de toda interacao (mensagens, tentativas de cotacao, handoff...)
      # persistida no MongoDB - ver agent-service/app/mongo_client.py. Sem
      # MONGO_ENCRYPTION_KEY valida, a persistencia fica desativada (nunca grava em claro).
      MONGO_URI: "mongodb://${MONGO_ROOT_USER:-autoseguro}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/?authSource=admin"
      MONGO_DB: "${MONGO_DB:-autoseguro}"
      MONGO_ENCRYPTION_KEY: "${MONGO_ENCRYPTION_KEY:-}"
    depends_on:
      quote-api:
        condition: service_started
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web-ui:
    build: ./web-ui
    ports:
      - "3000:80"
    depends_on:
      - agent-service
    restart: unless-stopped

volumes:
  mongo-data:
  agent-data:
