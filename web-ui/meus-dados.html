<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meus dados — AutoSeguro</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="login.css" />
<link rel="stylesheet" href="admin.css" />
<link rel="stylesheet" href="meus-dados.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__title">
        <span class="topbar__avatar">AS</span>
        <div>
          <div class="topbar__name">Meus dados</div>
          <div class="topbar__status" id="meus-dados-status">—</div>
        </div>
      </div>
      <div class="topbar__actions">
        <a class="topbar-avatar-link" id="topbar-avatar-usuario" href="meus-dados.html" title="Meus dados"></a>
        <span class="topbar__user" id="topbar-usuario"></span>
        <div class="menu-sanfona">
          <button class="btn btn--icon" id="btn-menu" title="Menu" aria-label="Abrir menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <rect x="3" y="5" width="18" height="2.2" rx="1.1"/>
              <rect x="3" y="11" width="18" height="2.2" rx="1.1"/>
              <rect x="3" y="17" width="18" height="2.2" rx="1.1"/>
            </svg>
          </button>
          <div class="menu-sanfona__painel" id="menu-painel" hidden>
            <a class="menu-sanfona__item" href="index.html">Ver site</a>
            <a class="menu-sanfona__item" href="atendente.html">Painel do atendente</a>
            <a class="menu-sanfona__item" href="relatorios.html">Relatórios</a>
            <a class="menu-sanfona__item" href="docs.html">Documentação</a>
            <a class="menu-sanfona__item" href="meus-dados.html">
              <span class="menu-sanfona__icon">🖼️</span> Meus dados
            </a>
            <a class="menu-sanfona__item" href="usuarios.html" id="link-usuarios">
              <span class="menu-sanfona__icon">👤</span> Usuários
            </a>
            <a class="menu-sanfona__item" href="admin.html" id="link-admin">
              <span class="menu-sanfona__icon">⚙️</span> Configurações
            </a>
            <button class="menu-sanfona__item menu-sanfona__item--sair" id="btn-sair">Sair</button>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-col">
        <section class="card admin-card">
          <div class="card__label">Foto de perfil</div>
          <p class="hint">Aparece ao lado do seu nome nos rankings de Relatórios e na lista de Usuários.</p>

          <div class="meus-dados-foto">
            <span id="foto-atual"></span>
            <div class="meus-dados-foto__acoes">
              <input id="input-foto" type="file" accept="image/*" />
              <span class="hint" style="margin:4px 0 0">Até 500KB.</span>
            </div>
          </div>

          <div class="meus-dados-botoes">
            <button class="btn btn--filled" id="btn-salvar-foto">Salvar foto</button>
            <button class="btn btn--outline" id="btn-remover-foto">Remover foto</button>
          </div>
          <p class="login-erro" id="foto-erro" hidden></p>
          <p class="sucesso-msg" id="foto-sucesso" hidden></p>
        </section>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="avatar.js"></script>
  <script src="menu.js"></script>
  <script src="meus-dados.js"></script>
</body>
</html>
