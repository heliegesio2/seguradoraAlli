server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem Cache-Control, o nginx so manda Last-Modified/ETag e o navegador usa
    # cache heuristica - explica paginas testando um fix e ainda vendo o JS
    # antigo ate dar um hard refresh. Forcar revalidacao em todo load evita isso
    # (ainda usa 304 quando o arquivo nao mudou, entao nao pesa banda).
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
